name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Match version to tag
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      - name: Verify isolated checks
        run: |
          python3 tests/check-store.py
          python3 tests/check-updates.py
      - name: Build Apple Silicon and Intel distributions
        run: |
          for arch in arm64 x86_64; do
            STRING_NOTES_ARCH="$arch" ./scripts/package.sh
            test "$(lipo -archs 'build/绳上便笺.app/Contents/MacOS/StringNotes')" = "$arch"
            STRING_NOTES_ARCH="$arch" ./scripts/package-dmg.sh
          done
      - name: Create release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.dmg dist/*.sha256 --verify-tag --latest --notes-file "release-notes/$GITHUB_REF_NAME.md" --title "绳上便笺 $GITHUB_REF_NAME · macOS"
          fi
